name: Refresh flat IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build playable flat M3U
        run: python scripts/build_playlist.py
      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/sports.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh flat IPTV streams"
            git push
          fi
